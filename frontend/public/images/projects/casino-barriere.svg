<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Casino building -->
  <rect x="100" y="200" width="600" height="300" fill="#1e293b" rx="12"/>

  <!-- Entrance canopy -->
  <path d="M250 200 L250 150 L550 150 L550 200 Z" fill="#dc2626"/>
  <rect x="250" y="200" width="300" height="250" fill="#334155" rx="8"/>

  <!-- Spotlights on facade -->
  <g opacity="0.8">
    <!-- Spotlight beams -->
    <path d="M150 500 L180 400 L190 400 L160 500 Z" fill="#f59e0b" opacity="0.6"/>
    <path d="M300 500 L320 350 L330 350 L310 500 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M450 500 L470 330 L480 330 L460 500 Z" fill="#f59e0b" opacity="0.6"/>
    <path d="M600 500 L620 380 L630 380 L610 500 Z" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Technical lighting fixtures -->
  <g>
    <rect x="140" y="480" width="30" height="20" fill="#475569" rx="3"/>
    <circle cx="155" cy="490" r="8" fill="#fbbf24"/>

    <rect x="290" y="480" width="30" height="20" fill="#475569" rx="3"/>
    <circle cx="305" cy="490" r="8" fill="#fbbf24"/>

    <rect x="440" y="480" width="30" height="20" fill="#475569" rx="3"/>
    <circle cx="455" cy="490" r="8" fill="#fbbf24"/>

    <rect x="590" y="480" width="30" height="20" fill="#475569" rx="3"/>
    <circle cx="605" cy="490" r="8" fill="#fbbf24"/>
  </g>

  <!-- Windows with interior lighting -->
  <g opacity="0.9">
    <rect x="270" y="230" width="60" height="50" fill="#fde047" rx="4"/>
    <rect x="350" y="230" width="60" height="50" fill="#fde047" rx="4"/>
    <rect x="430" y="230" width="60" height="50" fill="#fde047" rx="4"/>
    <rect x="270" y="300" width="60" height="50" fill="#fbbf24" rx="4"/>
    <rect x="350" y="300" width="60" height="50" fill="#fbbf24" rx="4"/>
    <rect x="430" y="300" width="60" height="50" fill="#fbbf24" rx="4"/>
  </g>

  <!-- Signage lights -->
  <circle cx="400" cy="170" r="8" fill="#ef4444"/>
  <circle cx="430" cy="170" r="8" fill="#ef4444"/>
  <circle cx="370" cy="170" r="8" fill="#ef4444"/>
</svg>
