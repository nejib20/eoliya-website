<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background - Sky with sunset -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGradient)"/>

  <!-- Hotel building -->
  <rect x="150" y="150" width="500" height="380" fill="#7c3aed" rx="12"/>

  <!-- Balconies -->
  <g opacity="0.8">
    <rect x="170" y="200" width="60" height="40" fill="#6d28d9" rx="4"/>
    <rect x="250" y="200" width="60" height="40" fill="#6d28d9" rx="4"/>
    <rect x="330" y="200" width="60" height="40" fill="#6d28d9" rx="4"/>
    <rect x="410" y="200" width="60" height="40" fill="#6d28d9" rx="4"/>
    <rect x="490" y="200" width="60" height="40" fill="#6d28d9" rx="4"/>
    <rect x="570" y="200" width="60" height="40" fill="#6d28d9" rx="4"/>
  </g>

  <!-- Hotel rooms with renovated lighting - Floor 1 -->
  <g>
    <rect x="180" y="210" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="200" cy="225" r="5" fill="#fff" opacity="0.8"/>

    <rect x="260" y="210" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="280" cy="225" r="5" fill="#fff" opacity="0.8"/>

    <rect x="340" y="210" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="360" cy="225" r="5" fill="#fff" opacity="0.8"/>

    <rect x="420" y="210" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="440" cy="225" r="5" fill="#fff" opacity="0.8"/>

    <rect x="500" y="210" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="520" cy="225" r="5" fill="#fff" opacity="0.8"/>

    <rect x="580" y="210" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="600" cy="225" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Floor 2 -->
  <g>
    <rect x="180" y="280" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="200" cy="295" r="5" fill="#fff" opacity="0.8"/>

    <rect x="260" y="280" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="280" cy="295" r="5" fill="#fff" opacity="0.8"/>

    <rect x="340" y="280" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="360" cy="295" r="5" fill="#fff" opacity="0.8"/>

    <rect x="420" y="280" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="440" cy="295" r="5" fill="#fff" opacity="0.8"/>

    <rect x="500" y="280" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="520" cy="295" r="5" fill="#fff" opacity="0.8"/>

    <rect x="580" y="280" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="600" cy="295" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Floor 3 -->
  <g>
    <rect x="180" y="350" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="200" cy="365" r="5" fill="#fff" opacity="0.8"/>

    <rect x="260" y="350" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="280" cy="365" r="5" fill="#fff" opacity="0.8"/>

    <rect x="340" y="350" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="360" cy="365" r="5" fill="#fff" opacity="0.8"/>

    <rect x="420" y="350" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="440" cy="365" r="5" fill="#fff" opacity="0.8"/>

    <rect x="500" y="350" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="520" cy="365" r="5" fill="#fff" opacity="0.8"/>

    <rect x="580" y="350" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="600" cy="365" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Floor 4 -->
  <g>
    <rect x="180" y="420" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="200" cy="435" r="5" fill="#fff" opacity="0.8"/>

    <rect x="260" y="420" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="280" cy="435" r="5" fill="#fff" opacity="0.8"/>

    <rect x="340" y="420" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="360" cy="435" r="5" fill="#fff" opacity="0.8"/>

    <rect x="420" y="420" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="440" cy="435" r="5" fill="#fff" opacity="0.8"/>

    <rect x="500" y="420" width="40" height="50" fill="#fbbf24" rx="3"/>
    <circle cx="520" cy="435" r="5" fill="#fff" opacity="0.8"/>

    <rect x="580" y="420" width="40" height="50" fill="#fde047" rx="3"/>
    <circle cx="600" cy="435" r="5" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Entrance -->
  <rect x="330" y="480" width="140" height="50" fill="#5b21b6" rx="6"/>
  <rect x="350" y="490" width="100" height="35" fill="#fde047" opacity="0.6" rx="4"/>

  <!-- Hotel star rating -->
  <g fill="#fbbf24">
    <circle cx="360" cy="120" r="8"/>
    <circle cx="380" cy="120" r="8"/>
    <circle cx="400" cy="120" r="8"/>
    <circle cx="420" cy="120" r="8"/>
  </g>
</svg>
