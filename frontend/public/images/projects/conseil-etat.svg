<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f1f5f9"/>

  <!-- Classical building with columns -->
  <rect x="150" y="250" width="500" height="280" fill="#cbd5e1" rx="8"/>
  <rect x="150" y="220" width="500" height="30" fill="#94a3b8"/>

  <!-- Pediment -->
  <path d="M130 220 L400 120 L670 220 Z" fill="#94a3b8"/>

  <!-- Columns -->
  <rect x="200" y="250" width="40" height="280" fill="#e2e8f0"/>
  <rect x="280" y="250" width="40" height="280" fill="#e2e8f0"/>
  <rect x="360" y="250" width="40" height="280" fill="#e2e8f0"/>
  <rect x="440" y="250" width="40" height="280" fill="#e2e8f0"/>
  <rect x="520" y="250" width="40" height="280" fill="#e2e8f0"/>
  <rect x="600" y="250" width="40" height="280" fill="#e2e8f0"/>

  <!-- Column bases -->
  <rect x="195" y="520" width="50" height="10" fill="#94a3b8"/>
  <rect x="275" y="520" width="50" height="10" fill="#94a3b8"/>
  <rect x="355" y="520" width="50" height="10" fill="#94a3b8"/>
  <rect x="435" y="520" width="50" height="10" fill="#94a3b8"/>
  <rect x="515" y="520" width="50" height="10" fill="#94a3b8"/>
  <rect x="595" y="520" width="50" height="10" fill="#94a3b8"/>

  <!-- Electrical panels and modern installations -->
  <g opacity="0.9">
    <!-- Electrical panel -->
    <rect x="180" y="350" width="60" height="80" fill="#1e293b" rx="4"/>
    <rect x="190" y="360" width="40" height="30" fill="#3b82f6" rx="2"/>
    <rect x="190" y="395" width="40" height="30" fill="#10b981" rx="2"/>

    <!-- Circuit breakers representation -->
    <circle cx="205" cy="375" r="3" fill="#fbbf24"/>
    <circle cx="215" cy="375" r="3" fill="#10b981"/>
    <circle cx="205" cy="410" r="3" fill="#10b981"/>
    <circle cx="215" cy="410" r="3" fill="#10b981"/>
  </g>

  <!-- Compliance check marks -->
  <g>
    <circle cx="680" cy="100" r="35" fill="#10b981" opacity="0.2"/>
    <path d="M665 100 L675 110 L695 85" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Electrical symbols -->
  <g opacity="0.7">
    <circle cx="120" cy="300" r="20" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M110 300 L130 300 M120 290 L120 310" stroke="#3b82f6" stroke-width="2"/>
  </g>

  <!-- Windows -->
  <rect x="250" y="280" width="50" height="60" fill="#64748b" opacity="0.3" rx="3"/>
  <rect x="330" y="280" width="50" height="60" fill="#64748b" opacity="0.3" rx="3"/>
  <rect x="410" y="280" width="50" height="60" fill="#64748b" opacity="0.3" rx="3"/>
  <rect x="490" y="280" width="50" height="60" fill="#64748b" opacity="0.3" rx="3"/>
  <rect x="570" y="280" width="50" height="60" fill="#64748b" opacity="0.3" rx="3"/>
</svg>
