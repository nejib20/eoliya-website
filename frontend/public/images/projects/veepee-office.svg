<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Building structure -->
  <rect x="150" y="150" width="500" height="350" fill="#1e293b" rx="8"/>

  <!-- Windows with LED lighting effect -->
  <g opacity="0.9">
    <!-- Floor 1 -->
    <rect x="180" y="180" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="280" y="180" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="380" y="180" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="480" y="180" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="580" y="180" width="80" height="60" fill="#fbbf24" rx="4"/>

    <!-- Floor 2 -->
    <rect x="180" y="260" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="280" y="260" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="380" y="260" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="480" y="260" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="580" y="260" width="80" height="60" fill="#fde047" rx="4"/>

    <!-- Floor 3 -->
    <rect x="180" y="340" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="280" y="340" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="380" y="340" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="480" y="340" width="80" height="60" fill="#fbbf24" rx="4"/>
    <rect x="580" y="340" width="80" height="60" fill="#fbbf24" rx="4"/>

    <!-- Floor 4 -->
    <rect x="180" y="420" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="280" y="420" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="380" y="420" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="480" y="420" width="80" height="60" fill="#fde047" rx="4"/>
    <rect x="580" y="420" width="80" height="60" fill="#fde047" rx="4"/>
  </g>

  <!-- Light rays effect -->
  <g opacity="0.3">
    <line x1="220" y1="210" x2="220" y2="140" stroke="#fbbf24" stroke-width="2"/>
    <line x1="420" y1="210" x2="420" y2="120" stroke="#fde047" stroke-width="3"/>
    <line x1="620" y1="210" x2="620" y2="130" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- LED icon -->
  <circle cx="700" cy="80" r="40" fill="#10b981" opacity="0.2"/>
  <path d="M700 55 L700 75 M690 65 L710 65 M695 70 L705 70 M697 75 L703 75" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="700" cy="65" r="15" fill="none" stroke="#10b981" stroke-width="2"/>
</svg>
