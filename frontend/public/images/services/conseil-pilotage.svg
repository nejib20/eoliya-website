<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <defs>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#004C99;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Isometric Grid Lines (subtle background) -->
  <g opacity="0.1">
    <line x1="50" y1="200" x2="150" y2="150" stroke="#64748B" stroke-width="1"/>
    <line x1="150" y1="150" x2="250" y2="200" stroke="#64748B" stroke-width="1"/>
    <line x1="250" y1="200" x2="350" y2="150" stroke="#64748B" stroke-width="1"/>
  </g>

  <!-- Main Building (Isometric) -->
  <g transform="translate(120, 80)">
    <!-- Building Front Face -->
    <path d="M 0 60 L 0 0 L 80 -40 L 80 20 Z" fill="url(#buildingGrad)" stroke="#004C99" stroke-width="2"/>

    <!-- Building Side Face -->
    <path d="M 80 -40 L 140 -10 L 140 50 L 80 20 Z" fill="#0052A3" stroke="#004C99" stroke-width="2"/>

    <!-- Building Top Face -->
    <path d="M 0 0 L 80 -40 L 140 -10 L 60 30 Z" fill="#0077E6" stroke="#004C99" stroke-width="2"/>

    <!-- Windows Front -->
    <rect x="15" y="10" width="15" height="20" fill="#E0F2FE" opacity="0.8"/>
    <rect x="40" y="-5" width="15" height="20" fill="#E0F2FE" opacity="0.8"/>
    <rect x="15" y="35" width="15" height="20" fill="#E0F2FE" opacity="0.8"/>
    <rect x="40" y="20" width="15" height="20" fill="#E0F2FE" opacity="0.8"/>

    <!-- Windows Side -->
    <polygon points="95,-25 105,-20 105,0 95,5" fill="#BAE6FD" opacity="0.6"/>
    <polygon points="115,-15 125,-10 125,10 115,15" fill="#BAE6FD" opacity="0.6"/>
    <polygon points="95,0 105,5 105,25 95,30" fill="#BAE6FD" opacity="0.6"/>
    <polygon points="115,10 125,15 125,35 115,40" fill="#BAE6FD" opacity="0.6"/>
  </g>

  <!-- Blueprint/Plans Document -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="100" height="70" fill="white" stroke="#64748B" stroke-width="2" rx="2"/>
    <line x1="10" y1="15" x2="60" y2="15" stroke="#0066CC" stroke-width="2"/>
    <line x1="10" y1="25" x2="50" y2="25" stroke="#0066CC" stroke-width="1.5"/>
    <rect x="10" y="35" width="30" height="20" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <rect x="45" y="35" width="30" height="20" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="85" cy="15" r="6" fill="url(#accentGrad)"/>
    <path d="M 82 15 L 84 17 L 88 13" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Coordination Icons -->
  <g transform="translate(280, 180)">
    <!-- Helmet Icon -->
    <ellipse cx="30" cy="40" rx="25" ry="8" fill="#F97316" opacity="0.3"/>
    <path d="M 10 35 Q 10 20 30 15 Q 50 20 50 35 L 45 40 L 15 40 Z" fill="url(#accentGrad)" stroke="#EA580C" stroke-width="2"/>
    <rect x="28" y="40" width="4" height="10" fill="#EA580C"/>
    <rect x="20" y="50" width="20" height="3" fill="#64748B" rx="1"/>
  </g>

  <!-- Gear/Settings Icon (Coordination) -->
  <g transform="translate(200, 60)">
    <circle cx="30" cy="30" r="15" fill="white" stroke="#F97316" stroke-width="3"/>
    <circle cx="30" cy="30" r="8" fill="#F97316"/>
    <rect x="28" y="10" width="4" height="8" fill="#F97316" rx="1"/>
    <rect x="28" y="42" width="4" height="8" fill="#F97316" rx="1"/>
    <rect x="10" y="28" width="8" height="4" fill="#F97316" rx="1"/>
    <rect x="42" y="28" width="8" height="4" fill="#F97316" rx="1"/>
  </g>

  <!-- Connection Lines (Coordination) -->
  <g stroke="#F97316" stroke-width="2" stroke-dasharray="4,4" opacity="0.6">
    <line x1="230" y1="90" x2="200" y2="140"/>
    <line x1="230" y1="90" x2="280" y2="180"/>
  </g>

  <!-- Checkmarks (Quality Control) -->
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.2"/>
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <path d="M -4 0 L -2 3 L 4 -3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(320, 140)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.2"/>
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <path d="M -4 0 L -2 3 L 4 -3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>