<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF08A;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FDE047;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CBD5E1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004C99;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#FEFCE8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FEF08A;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FDE047;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Technical Grid Background -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="400" y2="100" stroke="#64748B" stroke-width="1"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#64748B" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#64748B" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#64748B" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#64748B" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#64748B" stroke-width="1"/>
  </g>

  <!-- Custom Luminaire (Modern Spotlight) -->
  <g transform="translate(150, 40)">
    <!-- Mounting Rail -->
    <rect x="30" y="0" width="40" height="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="1" rx="2"/>

    <!-- Adjustable Arm -->
    <rect x="45" y="8" width="10" height="30" fill="url(#blueAccent)" stroke="#004C99" stroke-width="1.5" rx="2"/>

    <!-- Joint -->
    <circle cx="50" cy="38" r="8" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
    <circle cx="50" cy="38" r="4" fill="#64748B"/>

    <!-- Light Housing -->
    <ellipse cx="50" cy="50" rx="28" ry="12" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>
    <path d="M 22 50 L 15 75 L 85 75 L 78 50 Z" fill="url(#metalGrad)" stroke="#64748B" stroke-width="2"/>

    <!-- LED Array Inside -->
    <g transform="translate(35, 58)">
      <circle cx="5" cy="0" r="3" fill="#F97316"/>
      <circle cx="15" cy="0" r="3" fill="#F97316"/>
      <circle cx="25" cy="0" r="3" fill="#F97316"/>
    </g>

    <!-- Front Glass/Lens -->
    <ellipse cx="50" cy="75" rx="35" ry="8" fill="#E0F2FE" opacity="0.5" stroke="#0066CC" stroke-width="1.5"/>

    <!-- Light Beam -->
    <path d="M 20 75 L 5 180 L 95 180 L 80 75 Z" fill="url(#lightBeam)" opacity="0.7"/>

    <!-- Glow Effect -->
    <ellipse cx="50" cy="130" rx="50" ry="60" fill="url(#spotGlow)" opacity="0.5"/>
  </g>

  <!-- Design Blueprint Element -->
  <g transform="translate(30, 200)">
    <rect x="0" y="0" width="120" height="80" fill="white" stroke="#0066CC" stroke-width="2" rx="2"/>

    <!-- Technical Drawing Lines -->
    <line x1="20" y1="20" x2="100" y2="20" stroke="#64748B" stroke-width="1"/>
    <line x1="60" y1="20" x2="60" y2="60" stroke="#64748B" stroke-width="1"/>

    <!-- Dimension Arrows -->
    <g stroke="#F97316" stroke-width="1.5">
      <line x1="15" y1="35" x2="15" y2="55"/>
      <path d="M 15 35 L 12 38 L 18 38 Z" fill="#F97316"/>
      <path d="M 15 55 L 12 52 L 18 52 Z" fill="#F97316"/>
    </g>

    <!-- Angle Arc -->
    <path d="M 60 40 Q 70 35 75 40" fill="none" stroke="#0066CC" stroke-width="1.5"/>
    <text x="72" y="37" font-family="Arial, sans-serif" font-size="10" fill="#0066CC">45°</text>

    <!-- Measurements -->
    <text x="5" y="48" font-family="Arial, sans-serif" font-size="9" fill="#64748B">500mm</text>
  </g>

  <!-- Customization Icons -->
  <g transform="translate(260, 200)">
    <!-- Color Palette -->
    <rect x="0" y="0" width="100" height="80" fill="white" stroke="#64748B" stroke-width="2" rx="2"/>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B" text-anchor="middle">SUR MESURE</text>

    <!-- Color Swatches -->
    <circle cx="20" cy="35" r="10" fill="#0066CC"/>
    <circle cx="45" cy="35" r="10" fill="#F97316"/>
    <circle cx="70" cy="35" r="10" fill="#64748B"/>

    <!-- Settings Slider -->
    <line x1="15" y1="55" x2="85" y2="55" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="55" r="6" fill="#0066CC" stroke="white" stroke-width="2"/>

    <!-- Checkmark -->
    <circle cx="50" cy="70" r="8" fill="#10B981"/>
    <path d="M 46 70 L 48 73 L 54 67" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Technical Specifications -->
  <g transform="translate(270, 50)">
    <rect x="0" y="0" width="90" height="100" fill="white" stroke="#0066CC" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="90" height="20" fill="url(#blueAccent)" rx="3"/>
    <text x="45" y="14" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">SPECS</text>

    <!-- Specifications List -->
    <text x="10" y="38" font-family="Arial, sans-serif" font-size="10" fill="#64748B">• Puissance: 50W</text>
    <text x="10" y="53" font-family="Arial, sans-serif" font-size="10" fill="#64748B">• CRI: 90+</text>
    <text x="10" y="68" font-family="Arial, sans-serif" font-size="10" fill="#64748B">• IP65</text>
    <text x="10" y="83" font-family="Arial, sans-serif" font-size="10" fill="#64748B">• 3000K-5000K</text>
  </g>

  <!-- Drafting Tools -->
  <g transform="translate(40, 50)">
    <!-- Compass -->
    <line x1="25" y1="10" x2="25" y2="35" stroke="#64748B" stroke-width="2"/>
    <line x1="25" y1="10" x2="40" y2="35" stroke="#64748B" stroke-width="2"/>
    <circle cx="25" cy="10" r="3" fill="#F97316"/>
    <circle cx="32.5" cy="22.5" r="15" fill="none" stroke="#0066CC" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Measurement Ruler -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="80" height="10" fill="#F97316" stroke="#EA580C" stroke-width="1" rx="1"/>
    <line x1="10" y1="0" x2="10" y2="5" stroke="white" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="8" stroke="white" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="30" y2="5" stroke="white" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="8" stroke="white" stroke-width="1.5"/>
    <line x1="50" y1="0" x2="50" y2="5" stroke="white" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="8" stroke="white" stroke-width="1.5"/>
    <line x1="70" y1="0" x2="70" y2="5" stroke="white" stroke-width="1"/>
  </g>
</svg>