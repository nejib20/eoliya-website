<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF08A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDE047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FACC15;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FEF08A;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#FDE047;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FACC15;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Circle Pattern -->
  <circle cx="200" cy="120" r="80" fill="url(#glowGrad)"/>

  <!-- LED Bulb Main -->
  <g transform="translate(180, 60)">
    <!-- Glow Effect -->
    <ellipse cx="20" cy="35" rx="45" ry="48" fill="url(#greenGlow)" opacity="0.4"/>

    <!-- Bulb Glass -->
    <path d="M 5 50 Q 5 20 20 10 Q 35 20 35 50 Z" fill="url(#bulbGrad)" stroke="#EAB308" stroke-width="2"/>

    <!-- LED Chip Inside -->
    <rect x="14" y="25" width="12" height="15" fill="#F97316" rx="1"/>
    <rect x="16" y="27" width="8" height="2" fill="#FEF08A"/>
    <rect x="16" y="31" width="8" height="2" fill="#FEF08A"/>
    <rect x="16" y="35" width="8" height="2" fill="#FEF08A"/>

    <!-- Light Rays -->
    <g stroke="#FDE047" stroke-width="2" opacity="0.6" stroke-linecap="round">
      <line x1="20" y1="15" x2="20" y2="0"/>
      <line x1="10" y1="20" x2="0" y2="12"/>
      <line x1="30" y1="20" x2="40" y2="12"/>
      <line x1="5" y1="35" x2="-5" y2="35"/>
      <line x1="35" y1="35" x2="45" y2="35"/>
    </g>

    <!-- Base/Socket -->
    <rect x="8" y="50" width="24" height="4" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
    <rect x="9" y="54" width="22" height="3" fill="#CBD5E1"/>
    <rect x="10" y="57" width="20" height="3" fill="#94A3B8"/>
    <rect x="11" y="60" width="18" height="3" fill="#CBD5E1"/>
    <rect x="12" y="63" width="16" height="4" fill="#64748B"/>
  </g>

  <!-- Energy Efficiency Arrow -->
  <g transform="translate(100, 180)">
    <!-- Arrow Down (Old Energy) -->
    <path d="M 15 0 L 15 40 L 25 30 M 15 40 L 5 30" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#DC2626">-80%</text>
  </g>

  <g transform="translate(280, 180)">
    <!-- Arrow Up (Savings) -->
    <path d="M 15 40 L 15 0 L 25 10 M 15 0 L 5 10" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-10" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981">Économies</text>
  </g>

  <!-- LED Badge -->
  <g transform="translate(280, 80)">
    <circle cx="25" cy="25" r="30" fill="url(#ledGrad)" opacity="0.2"/>
    <circle cx="25" cy="25" r="25" fill="url(#ledGrad)"/>
    <text x="25" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">LED</text>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">TECH</text>
  </g>

  <!-- Maintenance Tools -->
  <g transform="translate(60, 80)">
    <!-- Wrench -->
    <path d="M 10 30 L 15 25 L 20 30 L 22 28 L 25 31 L 27 29 L 24 26 L 26 24 L 21 19 L 19 21 L 14 16 Q 8 18 8 24 Q 8 28 10 30 Z" fill="#64748B" stroke="#475569" stroke-width="1.5"/>
    <circle cx="12" cy="22" r="3" fill="#94A3B8"/>

    <!-- Screwdriver -->
    <rect x="30" y="10" width="4" height="25" fill="#F97316" stroke="#EA580C" stroke-width="1" rx="1"/>
    <path d="M 30 10 L 28 5 L 36 5 L 34 10 Z" fill="#64748B"/>
    <rect x="30" y="35" width="4" height="8" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
  </g>

  <!-- Connection Lines -->
  <g stroke="#0066CC" stroke-width="2" stroke-dasharray="5,5" opacity="0.4">
    <path d="M 100 120 Q 140 140 180 135" fill="none"/>
    <path d="M 240 120 Q 260 140 280 120" fill="none"/>
  </g>

  <!-- Electric Bolt Icon -->
  <g transform="translate(190, 200)">
    <polygon points="10,0 5,12 12,12 8,24 18,10 12,10 16,0" fill="#F97316" stroke="#EA580C" stroke-width="1.5"/>
  </g>

  <!-- Eco Leaf -->
  <g transform="translate(310, 120)">
    <path d="M 10 20 Q 5 10 10 0 Q 15 5 15 15 Q 15 18 12.5 20 Q 15 18 20 18 Q 15 22 10 20 Z" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
    <path d="M 10 20 Q 12 12 10 5" stroke="#059669" stroke-width="1" fill="none"/>
  </g>
</svg>